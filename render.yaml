# Render Blueprint — https://render.com/docs/blueprint-spec
# Umut bu repoyu Render'da "New +> Blueprint" ile bağlar; Render bu dosyayı okur.
services:
  - type: web
    name: enflasyonum
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    # Önce migration, sonra web server — şema her deploy'da günceldir.
    startCommand: alembic upgrade head && uvicorn enflasyonum.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Render UI'da elle girilir (Neon URL'si) — asla repoya yazılmaz
      - key: PYTHON_VERSION
        value: 3.12.6
