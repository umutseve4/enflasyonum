name: live-ingest

# M1.4 canlı doğrulama: EVDS'den gerçek TÜFE çekimi.
# Sonuç artifacts/live-ingest.txt olarak commit'lenir.
# TP.TUKFIY2025.GENEL serisine geçiş sonrası beklenti: 24 dönem.
#
# Tetikleyici bilerek yalnızca workflow_dispatch. Daha önce bu dosyaya
# yapılan push de tetikliyordu; bu, workflow dosyasının düzenlenmesini
# canlı bir veri çekimine ve main'e commit atılmasına bağlıyordu.
# Bir dosyayı düzenlemek bir üretim yazması başlatmamalı.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite:///live.db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Migrate
        run: alembic upgrade head

      - name: Run live ingest twice (idempotency check)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          set +e
          python -m enflasyonum.ingest 24 > run1.txt 2>&1
          rc1=$?
          python -m enflasyonum.ingest 24 > run2.txt 2>&1
          rc2=$?
          mkdir -p artifacts
          {
            echo "# Canlı EVDS ingest doğrulaması"
            echo "tarih: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit codes: run1=$rc1 run2=$rc2"
            echo ""
            echo "--- KOSU 1 ---"
            cat run1.txt
            echo ""
            echo "--- KOSU 2 (idempotency) ---"
            cat run2.txt
          } > artifacts/live-ingest.txt
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            echo "Canlı ingest başarısız: run1=$rc1 run2=$rc2" >&2
            exit 1
          fi

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-ingest.txt
          git commit -m "ci: canlı ingest sonucu [skip ci]" || echo "no changes"
          git pull --rebase origin main
          git push
