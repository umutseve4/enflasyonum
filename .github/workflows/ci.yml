name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enflasyonum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enflasyonum_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests migrations
      - name: Migration smoke (up + down + up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: Test
        run: pytest
      - name: Debug report (on failure)
        if: failure() && matrix.python-version == '3.12' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI hata raporu (python ${{ matrix.python-version }})"
            echo '```'
            echo "--- pip check ---"
            pip check 2>&1 | head -20 || true
            echo "--- ruff ---"
            ruff check src tests migrations 2>&1 | head -80 || true
            echo "--- alembic upgrade head ---"
            alembic upgrade head 2>&1 | tail -30 || true
            echo "--- pytest ---"
            pytest -x -q 2>&1 | tail -80 || true
            echo '```'
          } > report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md

  patch-roadmap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/finalize-v071-usage-progress
      - name: Patch target branch roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''**Sıradaki iş:** 14 gün harcama girişi (M1 Done kapanışı, ~2026-09-01; şu an 3/14 gün). Sonrası: M5 adayları için karar turu. M3.3 Parquet bilinçli deferred.
'''
          addition = '''**v0.7.1 yardımcı ölçüm:** Privacy-safe `GET /usage-progress` canlı kontratı Actions run `33208165567` / job `98974471031` ile PASS; kalıcı kanıt commit'i `e9091da49fb95a0fbcc78bc7636fa3d8eb38c59e`. Endpoint yalnız aggregate ilerlemeyi ölçer, M1'i otomatik kapatmaz ve private sayaç değerleri kamuya açık kanıta taşınmaz; kamu göstergesi `3/14` kalır. M3.3 `deferred`, M5 beklemede.
'''
          if addition not in text:
              if text.count(old) != 1:
                  raise SystemExit('roadmap status anchor mismatch')
              text = text.replace(old, old + addition)
          marker = '''| 2026-08-20 | **M3.2 verified — bildirim döngüsü üretimde kanıtlandı.**'''
          row = '''| 2026-08-28 | **v0.7.1 privacy-safe kullanım ilerlemesi:** `GET /usage-progress` yalnız `distinct_days`, `target_days`, `remaining_days`, `complete` aggregate alanlarını döndürür; tarih, satır, tutar, kategori ve açıklama yayımlamaz. Canlı kontrat run `33208165567` / job `98974471031` ile PASS; artifact commit `e9091da49fb95a0fbcc78bc7636fa3d8eb38c59e`. | Ölçüm ile milestone hükmünü ayır: endpoint 14 farklı günü ölçer, M1'i otomatik kapatmaz. Private sayaç değerleri ROADMAP/issue/artifact'a taşınmaz; kamu göstergesi `3/14` kalır. M3.3 `deferred`, M5 beklemede. |
'''
          if row not in text:
              if text.count(marker) != 1:
                  raise SystemExit('roadmap decision anchor mismatch')
              text = text.replace(marker, row + marker)
          roadmap.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: finalize v0.7.1 usage-progress evidence"
          git push
