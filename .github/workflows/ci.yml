name: CI

on:
  push:
    branches: [main]
  pull_request:

# Salt okunur. Bu is hicbir sey yazmaz; hata raporu artik PR yorumu
# olarak degil, GitHub anotasyonu olarak uretiliyor.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enflasyonum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enflasyonum_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Workflow YAML syntax
        # Bir workflow dosyasini bozmak, o dosya kosmadigi surece sessizce
        # gecer; bozuk workflow hic tetiklenmez ve yoklugu yesil gorunur.
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  detail = str(error).replace("%", "%25").replace("\n", "%0A")
                  print(f"::error title=Bozuk workflow YAML::{path}: {detail}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Lint
        shell: bash
        run: |
          lint_log="$(mktemp)"
          if ! ruff check src tests migrations >"$lint_log" 2>&1; then
            first="$(grep -m 1 -E '^[^ ]+:[0-9]+:[0-9]+:' "$lint_log" || tail -n 1 "$lint_log")"
            echo "::error title=Ruff failed::${first//%/%25}"
            cat "$lint_log"
            exit 1
          fi
          cat "$lint_log"
      - name: Migration smoke (up + down + up)
        shell: bash
        run: |
          migration_log="$(mktemp)"
          if ! {
            alembic upgrade head
            alembic downgrade base
            alembic upgrade head
            alembic downgrade base
          } >"$migration_log" 2>&1; then
            last="$(tail -n 1 "$migration_log")"
            echo "::error title=Migration smoke failed::${last//%/%25}"
            cat "$migration_log"
            exit 1
          fi
          cat "$migration_log"
      - name: Test
        shell: bash
        run: |
          test_log="$(mktemp)"
          if ! pytest --tb=short >"$test_log" 2>&1; then
            first="$(grep -m 1 '^FAILED ' "$test_log" || tail -n 1 "$test_log")"
            echo "::error title=Pytest failed (python ${{ matrix.python-version }})::${first//%/%25}"
            cat "$test_log"
            exit 1
          fi
          cat "$test_log"
