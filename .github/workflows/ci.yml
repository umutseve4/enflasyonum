name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enflasyonum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enflasyonum_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests migrations
      - name: Migration smoke (up + down + up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: Test
        run: pytest
      - name: Debug report (on failure)
        if: failure() && matrix.python-version == '3.12' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI hata raporu (python ${{ matrix.python-version }})"
            echo '```'
            echo "--- pip check ---"
            pip check 2>&1 | head -20 || true
            echo "--- ruff ---"
            ruff check src tests migrations 2>&1 | head -80 || true
            echo "--- alembic upgrade head ---"
            alembic upgrade head 2>&1 | tail -30 || true
            echo "--- pytest ---"
            pytest -x -q 2>&1 | tail -80 || true
            echo '```'
          } > report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md

  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify expected parent and apply focused changes
        env:
          EXPECTED_PARENT: ffde5790dacf575adaa46786f575470a69222f7e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path

          main = Path('src/enflasyonum/main.py')
          text = main.read_text()
          old = '    return username_matches and token_matches\n'
          new = '    return username_matches & token_matches\n'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '    owner_username = os.getenv("ENFLASYONUM_OWNER_USERNAME", "owner") or "owner"\n'
          new = '    owner_username = os.getenv("ENFLASYONUM_OWNER_USERNAME", "owner").strip() or "owner"\n'
          assert text.count(old) == 1
          main.write_text(text)

          tests = Path('tests/test_privacy_boundary.py')
          text = tests.read_text()
          assert text.count('import os\n') == 1
          text = text.replace('import os\n', 'import os\nfrom types import SimpleNamespace\n')
          old = '@pytest.mark.parametrize("authorization", ["Basic !!!", "Basic", "******"])\n'
          new = '''@pytest.mark.parametrize(
    "authorization",
    [
        "Basic !!!",
        "Basic /w==",
        "Basic b3duZXI=",
        "Basic",
        "Bearer dGVzdA==",
    ],
)
'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          anchor = '''def test_invalid_credentials_returns_401(client):
    response = client.get("/", headers=_auth_header("owner", "wrong-token"))
    assert response.status_code == 401
    assert response.headers["www-authenticate"] == "Basic"
    _assert_private_cache_headers(response)


'''
          addition = anchor + '''def test_wrong_username_still_compares_token(client, monkeypatch):
    calls = []

    def recording_compare_digest(supplied, expected):
        calls.append((supplied, expected))
        return __import__("hmac").compare_digest(supplied, expected)

    monkeypatch.setattr(
        "enflasyonum.main.hmac",
        SimpleNamespace(compare_digest=recording_compare_digest),
    )
    response = client.get(
        "/", headers=_auth_header("wrong-owner", "test-owner-token")
    )

    assert response.status_code == 401
    assert calls == [
        ("wrong-owner", "owner"),
        ("test-owner-token", "test-owner-token"),
    ]


@pytest.mark.parametrize("configured_username", ["   ", " owner "])
def test_owner_username_is_normalized(client, monkeypatch, configured_username):
    monkeypatch.setenv("ENFLASYONUM_OWNER_USERNAME", configured_username)
    response = client.get(
        "/", headers=_auth_header("owner", "test-owner-token")
    )
    assert response.status_code == 200
    _assert_private_cache_headers(response)


'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition)
          tests.write_text(text)
          PY
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests migrations
      - name: Focused privacy tests
        run: pytest tests/test_privacy_boundary.py
      - name: Full tests
        run: pytest
      - name: Commit final source and tests; restore CI and remove one-time workflow
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/workflows/edge-hardening-once.yml
          { git diff --name-only; git diff --cached --name-only; } | sort -u > /tmp/changed
          printf '%s\n' .github/workflows/ci.yml .github/workflows/edge-hardening-once.yml src/enflasyonum/main.py tests/test_privacy_boundary.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml src/enflasyonum/main.py tests/test_privacy_boundary.py
          git commit -m 'test: harden owner auth edge cases'
          git push origin HEAD:copilot/emergency-privacy-hotfix
