name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply bounded auth and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("src/enflasyonum/main.py")
          source = main_path.read_text()
          old_return = "return username_matches and token_matches"
          new_return = "return username_matches & token_matches"
          if old_return not in source:
              raise SystemExit("expected credential-combination target missing")
          source = source.replace(old_return, new_return, 1)
          old_username = '    owner_username = os.getenv("ENFLASYONUM_OWNER_USERNAME", "owner") or "owner"'
          new_username = '''    owner_username = (
              os.getenv("ENFLASYONUM_OWNER_USERNAME", "owner").strip() or "owner"
          )'''
          if old_username not in source:
              raise SystemExit("expected username-normalization target missing")
          main_path.write_text(source.replace(old_username, new_username, 1))

          test_path = Path("tests/test_privacy_boundary.py")
          tests = test_path.read_text()
          tests = tests.replace(
              "from decimal import Decimal\n",
              "from decimal import Decimal\nfrom types import SimpleNamespace\n",
              1,
          )
          tests = tests.replace(
              "from enflasyonum import __version__, crud\n",
              "import enflasyonum.main as main_module\nfrom enflasyonum import __version__, crud\n",
              1,
          )
          start = tests.index('@pytest.mark.parametrize("authorization"')
          end = tests.index("\n\ndef test_valid_credentials", start)
          replacement = '''@pytest.mark.parametrize(
              "authorization",
              [
                  "Basic !!!",
                  "Basic /w==",
                  "Basic b3duZXI=",
                  "Basic",
                  "Bearer dGVzdA==",
              ],
          )
          def test_malformed_authorization_returns_401(client, authorization):
              response = client.get("/", headers={"Authorization": authorization})
              assert response.status_code == 401
              assert response.headers["www-authenticate"] == "Basic"
              _assert_private_cache_headers(response)


          def test_both_credential_comparisons_execute_when_username_is_wrong(client, monkeypatch):
              calls = []
              real_compare_digest = __import__("hmac").compare_digest

              def compare_digest(left, right):
                  calls.append((left, right))
                  return real_compare_digest(left, right)

              monkeypatch.setattr(
                  main_module, "hmac", SimpleNamespace(compare_digest=compare_digest)
              )
              token = os.environ["ENFLASYONUM_OWNER_TOKEN"]
              response = client.get("/", headers=_auth_header("wrong-owner", token))

              assert response.status_code == 401
              assert calls == [("wrong-owner", "owner"), (token, token)]


          @pytest.mark.parametrize(
              ("configured_username", "request_username"),
              [("   ", "owner"), ("  custom-owner  ", "custom-owner")],
          )
          def test_owner_username_is_trimmed_and_blank_falls_back_to_owner(
              client, monkeypatch, configured_username, request_username
          ):
              monkeypatch.setenv("ENFLASYONUM_OWNER_USERNAME", configured_username)
              token = os.environ["ENFLASYONUM_OWNER_TOKEN"]
              response = client.get("/", headers=_auth_header(request_username, token))

              assert response.status_code == 200
              _assert_private_cache_headers(response)
          '''
          test_path.write_text(tests[:start] + replacement + tests[end:])
          PY
      - name: Install and verify corrected tree
        env:
          DATABASE_URL: sqlite:////tmp/enflasyonum-hardening.db
        run: |
          pip install -e ".[dev]"
          ruff check src tests migrations
          pytest tests/test_privacy_boundary.py
          pytest
      - name: Restore workflow and persist corrected tree
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enflasyonum/main.py tests/test_privacy_boundary.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix: complete owner auth regression hardening"
          git push origin "HEAD:refs/heads/$BRANCH"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enflasyonum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enflasyonum_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests migrations
      - name: Migration smoke (up + down + up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: Test
        run: pytest
      - name: Debug report (on failure)
        if: failure() && matrix.python-version == '3.12' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI hata raporu (python ${{ matrix.python-version }})"
            echo '```'
            echo "--- pip check ---"
            pip check 2>&1 | head -20 || true
            echo "--- ruff ---"
            ruff check src tests migrations 2>&1 | head -80 || true
            echo "--- alembic upgrade head ---"
            alembic upgrade head 2>&1 | tail -30 || true
            echo "--- pytest ---"
            pytest -x -q 2>&1 | tail -80 || true
            echo '```'
          } > report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md
