name: EVDS Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-write-main
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Query EVDS series candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api_key = os.environ["EVDS_API_KEY"]
          root = "https://evds2.tcmb.gov.tr/service/evds/"
          candidates = [
              "TP.TUKFIY2025.GENEL",
              "TP.TUKFIY2025.01",
              "TP.TUKFIY2025.02",
              "TP.TUKFIY2025.03",
              "TP.TUKFIY2025.04",
              "TP.TUKFIY2025.05",
              "TP.TUKFIY2025.06",
              "TP.TUKFIY2025.07",
              "TP.TUKFIY2025.08",
              "TP.TUKFIY2025.09",
              "TP.TUKFIY2025.10",
              "TP.TUKFIY2025.11",
              "TP.TUKFIY2025.12",
              "TP.TUKFIY2025.13",
          ]

          rows = [
              "# EVDS discovery (safe evidence)",
              f"timestamp_utc: {datetime.now(timezone.utc).isoformat()}",
              "",
          ]
          for series in candidates:
              query = urllib.parse.urlencode(
                  {
                      "series": series,
                      "startDate": "01-08-2024",
                      "endDate": "31-12-2026",
                      "type": "json",
                  }
              )
              request = urllib.request.Request(
                  root + "series=" + urllib.parse.quote(series)
                  + "&startDate=01-08-2024&endDate=31-12-2026&type=json",
                  headers={"key": api_key},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  items = payload.get("items") or []
                  non_empty = sum(
                      1 for item in items
                      if any(value not in (None, "") for key, value in item.items() if key != "Tarih")
                  )
                  rows.append(f"{series}: HTTP 200; rows={len(items)}; non_empty_rows={non_empty}")
              except Exception as exc:
                  rows.append(f"{series}: ERROR {type(exc).__name__}")

          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/evds-discovery.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit changed safe evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/evds-discovery.txt
          if git diff --cached --quiet; then
            echo "No evidence change to commit."
            exit 0
          fi
          git commit -m "docs: refresh EVDS discovery evidence"
          git pull --rebase origin main
          git push origin HEAD:main
