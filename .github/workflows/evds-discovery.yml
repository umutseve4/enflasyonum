name: evds-discovery

# Tek seferlik/operasyonel keşif: 2025=100 bazlı yeni TÜFE serisinin EVDS kodunu bulur.
# Yalnızca yetkili bir kullanıcının açık workflow_dispatch çağrısıyla çalışır.
# Hiçbir sorgu adımı workflow'u düşürmez; her kabul edilen koşu önce immutable
# evidence ref'e, ardından latest projection olarak main'e yazılır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Query EVDS
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/evds-discovery.py > discovery.txt 2>&1 || true
          cat discovery.txt

      - name: Persist result
        run: |
          mkdir -p artifacts
          cp discovery.txt artifacts/evds-discovery.txt
          bash scripts/persist-evidence.sh \
            evds-discovery \
            artifacts/evds-discovery.txt \
            "ci: EVDS keşif sonucu"
