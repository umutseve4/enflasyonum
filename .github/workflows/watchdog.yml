name: watchdog

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        id: ping
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            --retry 5 \
            --retry-delay 20 \
            --retry-all-errors \
            https://enflasyonum-7gcn.onrender.com/health) || code="000"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "HTTP $code"

      - name: Open or update issue on failure
        if: steps.ping.outputs.code != '200'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Watchdog FAIL: /health unhealthy"
          CODE: ${{ steps.ping.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          BODY="Otomatik bekci: canli site saglikli yanit vermedi. HTTP $CODE. Render loglarini kontrol et. Run: $RUN_URL"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail if unhealthy
        if: steps.ping.outputs.code != '200'
        run: exit 1
