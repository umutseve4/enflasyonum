name: Health Watchdog

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://enflasyonum-7gcn.onrender.com
    steps:
      - name: Check health contract
        id: health
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["BASE_URL"].rstrip("/") + "/health"
          with urllib.request.urlopen(url, timeout=30) as response:
              body = response.read()
              status = response.status
          payload = json.loads(body)
          if status != 200 or payload != {"status": "ok", "version": "0.7.1"}:
              raise SystemExit(
                  f"health contract failed: HTTP {status}, payload={payload!r}"
              )
          print("health contract: PASS")
          PY

      - name: Open or update a GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Health watchdog failed"
          body=$(cat <<EOF
          The production health contract failed.

          - Workflow run: ${RUN_URL}
          - Ref: ${GITHUB_REF}
          - SHA: ${GITHUB_SHA}

          Inspect the workflow logs for details. No response body or credentials are included in this issue.
          EOF
          )
          issue_number="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number,title --jq '.[] | select(.title == "Health watchdog failed") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
