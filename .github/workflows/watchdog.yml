name: watchdog

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: health-watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        id: ping
        run: |
          set +e
          code=$(curl -sS -o /tmp/health -w "%{http_code}" \
            --max-time 90 \
            --retry 5 \
            --retry-delay 20 \
            --retry-all-errors \
            https://enflasyonum-7gcn.onrender.com/health) || code="000"

          contract_ok=false
          if [ "$code" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/health").read_text())
          assert value.get("status") == "ok"
          assert value.get("version") == "0.7.1"
          PY
          then
            contract_ok=true
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "contract_ok=$contract_ok" >> "$GITHUB_OUTPUT"
          echo "HTTP $code; contract_ok=$contract_ok"

      - name: Open or update issue on failure
        if: steps.ping.outputs.code != '200' || steps.ping.outputs.contract_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Watchdog FAIL: /health unhealthy"
          CODE: ${{ steps.ping.outputs.code }}
          CONTRACT_OK: ${{ steps.ping.outputs.contract_ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          BODY="Otomatik bekci: canli site saglikli yanit vermedi. HTTP $CODE, contract_ok=$CONTRACT_OK. Render loglarini kontrol et. Run: $RUN_URL"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail if unhealthy
        if: steps.ping.outputs.code != '200' || steps.ping.outputs.contract_ok != 'true'
        run: exit 1
