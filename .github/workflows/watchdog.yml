# Haftalık /health smoke — ürün gözetimi. Hata olursa idempotent GitHub Issue.
name: watchdog

on:
  schedule:
    - cron: "15 8 * * 1" # her Pazartesi 08:15 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: health-watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /health
        id: check
        run: |
          set +e
          code=$(curl -sS --max-time 180 --retry 3 --retry-delay 20 \
                 -o /tmp/health -w "%{http_code}" \
                 https://enflasyonum-7gcn.onrender.com/health)
          curl_rc=$?
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "curl_rc=$curl_rc" >> "$GITHUB_OUTPUT"
          if [ "$curl_rc" -ne 0 ] || [ "$code" != "200" ]; then exit 1; fi
          python - <<'PY'
          import json
          p = json.load(open('/tmp/health'))
          assert p.get('status') == 'ok', p
          assert p.get('version') == '0.7.1', p
          PY
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.check.outputs.http_code }}
          CURL_RC: ${{ steps.check.outputs.curl_rc }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[WATCHDOG] /health başarısız"
          BODY="Otomatik sağlık kontrolü başarısız oldu. HTTP: ${CODE:-yok}, curl_rc: ${CURL_RC:-yok}. Koşu: $RUN_URL"
          NUM=$(gh issue list --state open --search '"[WATCHDOG] /health başarısız" in:title' --json number,title \
                --jq '.[] | select(.title == "[WATCHDOG] /health başarısız") | .number' | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "bug"
          fi
