name: Post-ingest Evidence Verification

on:
  workflow_run:
    workflows: ["Live EVDS Ingest Evidence"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-ingest-verify-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify persisted evidence signatures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/live-ingest.txt")
          if not path.exists():
              raise SystemExit("artifacts/live-ingest.txt is missing")

          text = path.read_text(encoding="utf-8")
          checks = {
              "single UTC timestamp": text.count("tarih: ") == 1 and "Z\n" in text,
              "zero exit codes": text.count("exit codes: run1=0 run2=0") == 1,
              "single run-1 section": text.count("--- KOSU 1 ---") == 1,
              "single run-2 section": text.count("--- KOSU 2 (idempotency) ---") == 1,
              "two PASS summaries": text.count("sonuc: PASS") == 2,
          }
          failures = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'FAIL'}")
          if failures:
              raise SystemExit("Evidence verification failed: " + ", ".join(failures))
          PY
