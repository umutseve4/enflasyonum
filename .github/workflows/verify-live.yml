name: verify-live

# Canlı doğrulama deseni: bu dosya main'e push edilince koşar, canlı URL'yi yoklar,
# kanıtı artifacts/live-history-verify.txt olarak bot commit'iyle repoya yazar.
# v0.7.1 retry: ilk merge koşusu deploy tamamlanmadan çalıştı; bu yorum kontrollü yeniden tetikler.
# NOT: /export.csv ve /usage-progress kişisel veri yüzeyleridir; yanıt gövdeleri
# ASLA kanıta yazılmaz. Yalnız güvenli metadata ve kontrat boolean'ları kaydedilir.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Canlı uçları yokla (Render free uykudan uyanabilir, retry'lı)
        run: |
          set -u
          mkdir -p artifacts
          OUT=artifacts/live-history-verify.txt
          BASE="https://enflasyonum-7gcn.onrender.com"
          echo "verify-live koşusu: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT"
          FAIL=0
          for P in /health /history.svg /card.svg /export.csv /usage-progress; do
            CODE=$(curl -s -D /tmp/hdr -o /tmp/resp -w "%{http_code}" --max-time 180 \
                   --retry 6 --retry-delay 20 --retry-all-errors "$BASE$P" || echo "000")
            SIZE=$(wc -c < /tmp/resp | tr -d ' ')
            echo "" >> "$OUT"
            echo "== $P -> HTTP $CODE, $SIZE bytes ==" >> "$OUT"
            if [ "$P" = "/history.svg" ] || [ "$P" = "/card.svg" ]; then
              if [ "$CODE" = "200" ] && grep -q "<svg" /tmp/resp; then
                echo "SVG kök etiketi bulundu: PASS" >> "$OUT"
              else
                echo "SVG doğrulaması: FAIL" >> "$OUT"; FAIL=1
              fi
              head -c 500 /tmp/resp >> "$OUT"; echo "" >> "$OUT"
            elif [ "$P" = "/export.csv" ]; then
              HEXHEAD=$(head -c 3 /tmp/resp | od -An -tx1 | tr -d ' \n')
              FIRSTLINE=$(head -c 60 /tmp/resp | tail -c +4 | head -n 1 | tr -d '\r')
              CT_OK=0; grep -qi "^content-type: *text/csv" /tmp/hdr && CT_OK=1
              HDR_OK=0; [ "$FIRSTLINE" = "tarih,kategori,aciklama,tutar" ] && HDR_OK=1
              echo "hexhead=$HEXHEAD content_type_ok=$CT_OK header_ok=$HDR_OK" >> "$OUT"
              if [ "$CODE" = "200" ] && [ "$HEXHEAD" = "efbbbf" ] && [ "$CT_OK" = "1" ] && [ "$HDR_OK" = "1" ]; then
                echo "CSV doğrulaması (BOM + tam başlık + content-type): PASS" >> "$OUT"
              else
                echo "CSV doğrulaması: FAIL" >> "$OUT"; FAIL=1
              fi
            elif [ "$P" = "/usage-progress" ]; then
              if [ "$CODE" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/resp").read_text())
          assert set(value) == {
              "distinct_days", "target_days", "remaining_days", "complete"
          }
          assert type(value["distinct_days"]) is int
          assert value["target_days"] == 14
          assert type(value["remaining_days"]) is int
          assert value["remaining_days"] >= 0
          assert type(value["complete"]) is bool
          PY
              then
                echo "Usage progress kontratı (alanlar + türler + hedef + clamp): PASS" >> "$OUT"
              else
                echo "Usage progress kontratı: FAIL" >> "$OUT"; FAIL=1
              fi
            elif [ "$P" = "/health" ]; then
              if [ "$CODE" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/resp").read_text())
          assert value.get("status") == "ok"
          assert value.get("version") == "0.7.1"
          PY
              then
                echo "Health kontratı (status=ok + version=0.7.1): PASS" >> "$OUT"
              else
                echo "Health kontratı: FAIL" >> "$OUT"; FAIL=1
              fi
            else
              [ "$CODE" = "200" ] || FAIL=1
            fi
          done
          echo "" >> "$OUT"
          echo "===== OTOMATIK KONTROL =====" >> "$OUT"
          if [ "$FAIL" = "0" ]; then
            echo "SONUC: PASS" >> "$OUT"
          else
            echo "SONUC: FAIL" >> "$OUT"
          fi
          cat "$OUT"
          exit "$FAIL"

      - name: Kanıtı commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-history-verify.txt
          git commit -m "chore: canlı doğrulama kanıtı (history+card+export+usage) [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin main
          git push origin main
