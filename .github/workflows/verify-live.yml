name: verify-live

# Canli gizlilik kontratini dogrular.
#
# Render ucretsiz katmani bosta kalan servisi uykuya alir ve ilk istege
# uygulamanin kendisi yerine bir "Service waking up" ara sayfasi dondurur.
# Bu ara sayfa curl icin hata degildir; --retry-all-errors onu yeniden
# denemez. Dolayisiyla uyuyan bir servise dogrudan kontrat sorulursa 12
# kontrolun 12'si de saniyeler icinde duser ve uygulama saglikli oldugu
# halde kirmizi alinir (bkz. kosu #10, 20 saniyede FAIL).
#
# Cozum: once uyandir, sonra sor. Uyandirma ayri bir adimdir; boylece
# "uygulama hic uyanmadi" kirmizisi ile "uyandi ve kontrati bozdu"
# kirmizisi birbirine karismaz.
on:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: "https://enflasyonum-7gcn.onrender.com"
    steps:
      - uses: actions/checkout@v7

      - name: Warm up the Render instance (cold-start guard)
        id: warmup
        run: |
          set -u
          ATTEMPTS=12
          DELAY=15
          AWAKE=0
          FIRST_CODE=""
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE=$(curl -s -o /tmp/warm -w "%{http_code}" --max-time 90 "$BASE/health" || echo "000")
            [ -n "$FIRST_CODE" ] || FIRST_CODE="$CODE"
            if [ "$CODE" = "200" ] && python - 2>/dev/null <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/warm").read_text())
          assert value.get("status") == "ok"
          PY
            then
              AWAKE=1
              echo "warm-up attempt $i: HTTP $CODE, uygulama uyanik"
              break
            fi
            echo "warm-up attempt $i: HTTP $CODE, govde henuz uygulama degil; $DELAY sn bekleniyor"
            sleep "$DELAY"
          done

          {
            echo "## Cold-start warm-up"
            echo ""
            echo "- ilk yanit kodu: \`$FIRST_CODE\`"
            echo "- uygulama uyandi mi: **$([ "$AWAKE" = "1" ] && echo evet || echo hayir)**"
            echo "- deneme butcesi: $ATTEMPTS x $DELAY sn"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AWAKE" != "1" ]; then
            # Ayni ilke: erisilebilirlik bir kod kusuru degildir. Ucretsiz
            # katmanin uyanmamasini kirmiziya cevirmek, hicbir commit'in
            # duzeltemedigi bir kirmizi uretir. Uyari birakip devam ediyoruz;
            # dogrulama adimi zaten olcemedigini INCONCLUSIVE olarak yazacak.
            echo "::warning title=Uygulama uyanmadi::$((ATTEMPTS * DELAY)) sn icinde /health gercek JSON govdesi dondurmedi. Bu bir kontrat ihlali DEGIL, erisilebilirlik durumudur."
          fi

      - name: Validate live privacy contract
        run: |
          set -u
          mkdir -p artifacts
          OUT=artifacts/live-history-verify.txt
          FAIL=0
          UNKNOWN=0
          HEALTH_BEFORE="000"
          echo "verify-live run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT"

          # Onceki kosu (07488dd0) su celiskiyi verdi: sekiz ozel yolun
          # sekizinde de curl_rc=23 (yazma hatasi), hdr_bytes=339, stderr bos.
          # Yani basliklar eksiksiz geldi, sonra aktarim oldu. Geriye iki
          # okuma kaldi: HTTP/2 akisinin sunucu tarafindan sifirlanmasi, ya da
          # uygulamanin yaniti gercekten yarida kesmesi. Bunlari ayirmanin tek
          # yolu ayni istegi bir de --http1.1 ile sormak ve durum satirini
          # kayda gecmektir.
          #
          # Baslik DEGERLERI degil yalnizca ADLARI ve durum satiri yazilir.
          # Bu depo herkese acik; bir 401 yanitinin basliklarinda Set-Cookie
          # gibi bir sey cikarsa onu isleyip yayinlamis oluruz.
          probe() {
            # $1 method, $2 path, $3 extra curl args, $4 header file
            set +e
            : > /tmp/body
            curl -s -S -D "$4" -o /tmp/body -w "%{http_code}" --max-time 180 \
                 --retry 6 --retry-delay 20 --retry-all-errors \
                 $3 -X "$1" "$BASE$2" >/tmp/w.txt 2>/tmp/curl_err
            PROBE_RC=$?
            set -e
            PROBE_CODE="$(cat /tmp/w.txt 2>/dev/null)"
            [ -n "$PROBE_CODE" ] || PROBE_CODE="000"
          }

          check_private() {
            METHOD="$1"
            PATHNAME="$2"
            HDR_FILE="$(mktemp)"
            : > "$HDR_FILE"
            probe "$METHOD" "$PATHNAME" "" "$HDR_FILE"
            CODE="$PROBE_CODE"
            RC="$PROBE_RC"
            ERR="$(tr -d '\n' < /tmp/curl_err | cut -c1-160)"
            HDR_BYTES=$(wc -c < "$HDR_FILE" | tr -d ' ')
            STATUS_LINE="$(head -n1 "$HDR_FILE" | tr -d '\r' | cut -c1-40)"
            HDR_NAMES="$(grep -oiE '^[A-Za-z0-9-]+:' "$HDR_FILE" | tr -d ':' \
                         | tr 'A-Z' 'a-z' | sort -u | paste -sd, -)"
            CF_CACHE="$(grep -i '^cf-cache-status:' "$HDR_FILE" | head -n1 | cut -d' ' -f2- | tr -d '\r' | cut -c1-24)"
            SRV="$(grep -i '^server:' "$HDR_FILE" | head -n1 | cut -d' ' -f2- | tr -d '\r' | cut -c1-24)"
            ORIGIN="$(grep -i '^x-render-origin-server:' "$HDR_FILE" | head -n1 | cut -d' ' -f2- | tr -d '\r' | cut -c1-32)"
            # Govde YALNIZCA 2xx disi yanitlar icin kaydedilir. Render'in
            # ara sayfasi herkese acik bir HTML'dir; basarili bir yanitin
            # govdesi ise kullanici verisi olabilir, o asla yazilmaz.
            BODY=""
            case "$CODE" in
              2*) : ;;
              *) BODY="$(tr -cd '\11\12\15\40-\176' < /tmp/body | tr '\11\12\15' '   ' | tr -s ' ' | cut -c1-180)" ;;
            esac
            CC=0; PR=0; VA=0; WA=0
            grep -qi "^cache-control: *no-store" "$HDR_FILE" && CC=1
            grep -qi "^pragma: *no-cache" "$HDR_FILE" && PR=1
            grep -qi "^vary:.*authorization" "$HDR_FILE" && VA=1
            grep -qi "^www-authenticate: *Basic" "$HDR_FILE" && WA=1
            rm -f "$HDR_FILE"
            echo "path=$PATHNAME method=$METHOD status=$CODE curl_rc=$RC hdr_bytes=$HDR_BYTES status_line=\"$STATUS_LINE\" hdr_names=\"$HDR_NAMES\" cf_cache=\"$CF_CACHE\" server=\"$SRV\" cache_no_store=$CC pragma_no_cache=$PR vary_auth=$VA www_auth_basic=$WA origin_server=\"$ORIGIN\"" >> "$OUT"
            [ -z "$BODY" ] || echo "  body_prefix=\"$BODY\"" >> "$OUT"

            if [ "$CODE" = "000" ]; then
              # Ikinci sorgu: ayni istek, HTTP/1.1'e zorlanmis. Bu gecerse
              # sorun uygulamada degil, HTTP/2 aktariminda demektir.
              H2_FILE="$(mktemp)"
              probe "$METHOD" "$PATHNAME" "--http1.1" "$H2_FILE"
              H1_CODE="$PROBE_CODE"; H1_RC="$PROBE_RC"
              H1_LINE="$(head -n1 "$H2_FILE" | tr -d '\r' | cut -c1-40)"
              rm -f "$H2_FILE"
              echo "  http11_retry path=$PATHNAME status=$H1_CODE curl_rc=$H1_RC status_line=\"$H1_LINE\"" >> "$OUT"
              if [ "$H1_CODE" != "000" ]; then
                echo "::warning title=HTTP2 aktarim hatasi::$METHOD $PATHNAME varsayilan aktarimda curl_rc=$RC verdi ama --http1.1 ile HTTP $H1_CODE dondu. Kusur HTTP/2 katmanindadir."
              else
                echo "::warning title=Ozel yol ulasilamadi::$METHOD $PATHNAME iki aktarimda da yanitsiz (curl_rc=$RC / $H1_RC, durum satiri: ${STATUS_LINE:-yok}, kenar: ${SRV:-yok}). Bu bir gizlilik kusuru DEGIL, olcum boslugudur: yol ulasilamadigi icin sizinti olup olmadigi bilinmiyor."
              fi
              UNKNOWN=$((UNKNOWN + 1))
              return 0
            fi
            # Ayrim burada. Bir ozel yolun 2xx/3xx donmesi KANITLANMIS bir
            # sizintidir ve her zaman kirmizi olmalidir. 5xx ise kenar
            # sunucunun konusmasidir; hicbir commit onu duzeltemez, dolayisiyla
            # dali kirmiziya boyamasi da yanlis olur.
            case "$CODE" in
              401)
                : ;;
              2*|3*)
                echo "::error title=Ozel yol korumasiz::$METHOD $PATHNAME -> HTTP $CODE. 401 bekleniyordu; bu yol kimlik dogrulamasi olmadan yanit veriyor."
                FAIL=1
                return 0 ;;
              5*|000)
                echo "::warning title=Ozel yol ulasilamadi::$METHOD $PATHNAME -> HTTP $CODE (kenar: ${SRV:-yok}). Olcum yapilamadi."
                UNKNOWN=$((UNKNOWN + 1))
                return 0 ;;
              *)
                echo "::warning title=Beklenmeyen durum::$METHOD $PATHNAME -> HTTP $CODE (401 bekleniyordu). Sizinti degil, ama sozlesme de dogrulanamadi."
                UNKNOWN=$((UNKNOWN + 1))
                return 0 ;;
            esac
            [ "$CC" = "1" ] || { echo "::error title=Baslik eksik::$METHOD $PATHNAME icin Cache-Control: no-store yok."; FAIL=1; }
            [ "$PR" = "1" ] || { echo "::error title=Baslik eksik::$METHOD $PATHNAME icin Pragma: no-cache yok."; FAIL=1; }
            [ "$VA" = "1" ] || { echo "::error title=Baslik eksik::$METHOD $PATHNAME icin Vary: Authorization yok."; FAIL=1; }
            [ "$WA" = "1" ] || { echo "::error title=Baslik eksik::$METHOD $PATHNAME icin WWW-Authenticate: Basic yok."; FAIL=1; }
          }

          check_public() {
            PATHNAME="$1"
            METHOD="$2"
            set +e
            CODE=$(curl -s -D /tmp/hdr -o /tmp/resp -w "%{http_code}" --max-time 180 \
                   --retry 6 --retry-delay 20 --retry-all-errors -X "$METHOD" "$BASE$PATHNAME" 2>/dev/null)
            RC=$?
            set -e
            [ -n "$CODE" ] || CODE="000"
            SAFE=0
            if [ "$PATHNAME" = "/health" ] && [ "$METHOD" = "GET" ]; then
              if [ "$CODE" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/resp").read_text())
          assert set(value) == {"status", "version"}
          assert value["status"] == "ok"
          assert isinstance(value["version"], str)
          PY
              then SAFE=1; fi
            elif [ "$PATHNAME" = "/usage-progress" ] && [ "$METHOD" = "GET" ]; then
              if [ "$CODE" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/resp").read_text())
          assert set(value) == {"distinct_days", "target_days", "remaining_days", "complete"}
          assert isinstance(value["distinct_days"], int)
          assert value["target_days"] == 14
          assert isinstance(value["remaining_days"], int)
          assert value["remaining_days"] >= 0
          assert isinstance(value["complete"], bool)
          PY
              then SAFE=1; fi
            elif [ "$METHOD" = "HEAD" ] && [ "$CODE" = "200" ]; then
              SAFE=1
            fi
            if [ "$PATHNAME" = "/health" ] && [ "$METHOD" = "GET" ]; then
              HEALTH_BEFORE="$CODE"
            fi
            PCF="$(grep -i '^cf-cache-status:' /tmp/hdr | head -n1 | cut -d' ' -f2- | tr -d '\r' | cut -c1-24)"
            echo "path=$PATHNAME method=$METHOD status=$CODE curl_rc=$RC cf_cache=\"$PCF\" public_contract_ok=$SAFE" >> "$OUT"
            if [ "$SAFE" != "1" ]; then
              case "$CODE" in
                000|5*)
                  # Servis uyuyor ya da kenar sunucu cevap veriyor. Olcum yok.
                  echo "::warning title=Acik yol ulasilamadi::$METHOD $PATHNAME -> HTTP $CODE (curl_rc=$RC). Olcum yapilamadi."
                  UNKNOWN=$((UNKNOWN + 1)) ;;
                *)
                  # Yanit geldi ve sozlesmeye uymuyor. Bu gercek bir kusurdur.
                  echo "::error title=Acik kontrat ihlali::$METHOD $PATHNAME -> HTTP $CODE, beklenen govde semasi dogrulanamadi."
                  FAIL=1 ;;
              esac
            fi
          }

          check_public /health GET
          check_public /health HEAD
          check_public /usage-progress GET
          check_public /usage-progress HEAD

          check_private GET /
          check_private GET /card.svg
          check_private GET /history.svg
          check_private GET /export.csv
          check_private POST /expenses
          check_private GET /docs
          check_private GET /redoc
          check_private GET /openapi.json

          # Sira testi. Kosu d73180e4'te dort acik yol 200 dondu, hemen
          # ardindan sekiz ozel yolun sekizi de Render'in 503 ara sayfasini
          # aldi -- yedi saniye icinde. Iki okuma mumkundu:
          #   (a) uygulama ozel yollardan birinde oldu ve o andan sonra her
          #       istek kenar sunucudan 503 aliyor;
          #   (b) uygulama saglikli, kenar sunucu yalnizca o yollari 503
          #       ile karsiliyor.
          # Ayni /health'i ozel yol blogundan SONRA bir kez daha sormak bu
          # ikisini ayirir. d73180e4'te cevap (b) cikti: health_after 200,
          # ve acik yollarda cf_cache=DYNAMIC oldugu icin o 200'ler onbellek
          # isabeti degil, kaynak sunucunun kendi yaniti. Test yine de burada
          # kaliyor: yarin (a) olursa onu yakalayacak tek olcum budur.
          HB="$(mktemp)"
          probe GET /health "" "$HB"
          H_AFTER_LINE="$(head -n1 "$HB" | tr -d '\r' | cut -c1-40)"
          rm -f "$HB"
          echo "health_before=$HEALTH_BEFORE health_after status=$PROBE_CODE curl_rc=$PROBE_RC status_line=\"$H_AFTER_LINE\"" >> "$OUT"
          if [ "$HEALTH_BEFORE" != "200" ]; then
            # Blok oncesinde de ayakta degildi. Bir gecis yok, dolayisiyla
            # "blok icinde dustu" demek olcume degil varsayima dayanirdi.
            echo "::warning title=Sira testi uygulanamadi::/health ozel yol blogundan ONCE de 200 degildi (HTTP $HEALTH_BEFORE). Once/sonra karsilastirmasi anlamsiz; servis bastan beri ulasilamiyor."
            UNKNOWN=$((UNKNOWN + 1))
          elif [ "$PROBE_CODE" != "200" ]; then
            # Gercek bir gecis: once 200, sonra degil. Bunu ozel yol
            # bloguna giren istekler tetikledi; bu uygulamanin kusurudur.
            echo "::error title=Uygulama blok icinde dustu::/health ozel yol blogundan ONCE 200 iken SONRA HTTP $PROBE_CODE (durum satiri: ${H_AFTER_LINE:-yok}). Kusur kenar sunucuda degil, uygulamanin kendisindedir: ozel yollardan biri sureci dusuruyor."
            FAIL=1
          else
            echo "::notice title=Uygulama ayakta kaldi::/health ozel yol blogundan ONCE de SONRA da 200 donuyor (cf_cache=DYNAMIC, yani onbellek degil kaynak sunucu yanitliyor). Uygulama saglikli; 503 yanitlari kenar sunucudan geliyor."
          fi

          # Uc degerli sonuc. "Kusur bulundu" ile "olcemedim" ayni sey degil;
          # ikisini tek bir kirmiziya katlamak, hicbir commit'in duzeltemedigi
          # bir kirmizi uretir ve kirmizinin anlamini yok eder.
          if [ "$FAIL" != "0" ]; then
            echo "result=FAIL unknown=$UNKNOWN" >> "$OUT"
          elif [ "$UNKNOWN" != "0" ]; then
            echo "result=INCONCLUSIVE unknown=$UNKNOWN" >> "$OUT"
          else
            echo "result=PASS unknown=0" >> "$OUT"
          fi
          cat "$OUT"

          # Kanit iki yere birden yazilir: adim ozeti (tarayicidan okunur)
          # ve depoya islenen dosya (API'den okunur). Kirmizi kosuda kanit
          # kaybolmamali; teshis tam da o anda gerekiyor.
          {
            echo ""
            echo "## Live privacy contract"
            echo ""
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$FAIL"

      - name: Commit evidence
        # always(): kanit tam da en cok gerektigi anda, yani kirmizi
        # kosuda kayboluyordu. Adim ozeti tarayicidan okunur ama API'den
        # okunmaz; depoya islenen dosya her ikisinden de okunur.
        if: always()
        run: |
          if [ ! -f artifacts/live-history-verify.txt ]; then
            echo "kanit dosyasi uretilmedi (is uyandirma adiminda dustu)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-history-verify.txt
          git commit -m "chore: canli gizlilik dogrulama kaniti [skip ci]" || echo "no changes"
          git pull --rebase origin main
          git push origin main
