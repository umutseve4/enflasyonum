name: Verify Live Product

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-write-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BASE_URL: https://enflasyonum-7gcn.onrender.com
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify live endpoints without persisting response bodies
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base_url = os.environ["BASE_URL"].rstrip("/")
          rows = [
              f"verify-live koşusu: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}",
              "",
          ]

          def fetch(path):
              request = urllib.request.Request(base_url + path)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return response.status, response.headers.get("Content-Type", ""), body

          status, content_type, body = fetch("/health")
          payload = json.loads(body)
          health_ok = status == 200 and payload == {"status": "ok", "version": "0.7.1"}
          rows += [
              f"== /health -> HTTP {status}, {len(body)} bytes ==",
              f"Health kontratı (status=ok + version=0.7.1): {'PASS' if health_ok else 'FAIL'}",
              "",
          ]

          svg_results = []
          for path in ("/history.svg", "/card.svg"):
              status, content_type, body = fetch(path)
              svg_ok = status == 200 and body.lstrip().startswith(b"<svg")
              svg_results.append(svg_ok)
              rows += [
                  f"== {path} -> HTTP {status}, {len(body)} bytes ==",
                  f"SVG kök etiketi bulundu: {'PASS' if svg_ok else 'FAIL'}",
                  "",
              ]

          status, content_type, body = fetch("/export.csv")
          text = body.decode("utf-8-sig")
          header = next(csv.reader(io.StringIO(text)))
          expected_header = ["id", "ay", "tutar", "kategori", "agirlik"]
          csv_ok = (
              status == 200
              and body.startswith(b"\xef\xbb\xbf")
              and "text/csv" in content_type.lower()
              and header == expected_header
          )
          rows += [
              f"== /export.csv -> HTTP {status}, {len(body)} bytes ==",
              "CSV doğrulaması (BOM + tam başlık + content-type): "
              + ("PASS" if csv_ok else "FAIL"),
              "",
          ]

          status, content_type, body = fetch("/usage-progress")
          usage = json.loads(body)
          usage_ok = (
              status == 200
              and set(usage) == {"current_days", "target_days", "progress_pct", "remaining_days"}
              and all(type(usage[key]) is int for key in usage)
              and usage["target_days"] == 14
              and 0 <= usage["progress_pct"] <= 100
              and usage["remaining_days"] == max(14 - usage["current_days"], 0)
          )
          rows += [
              f"== /usage-progress -> HTTP {status}, {len(body)} bytes ==",
              "Usage progress kontratı (alanlar + türler + hedef + clamp): "
              + ("PASS" if usage_ok else "FAIL"),
              "",
          ]

          overall = health_ok and all(svg_results) and csv_ok and usage_ok
          rows += ["===== OTOMATIK KONTROL =====", f"SONUC: {'PASS' if overall else 'FAIL'}"]
          Path("artifacts/live-history-verify.txt").write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8",
          )
          print("\n".join(rows))
          if not overall:
              raise SystemExit("Live product verification failed")
          PY

      - name: Commit changed privacy-safe evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-history-verify.txt
          if git diff --cached --quiet; then
            echo "No evidence change to commit."
            exit 0
          fi
          git commit -m "docs: refresh live product verification evidence"
          git pull --rebase origin main
          git push origin HEAD:main
